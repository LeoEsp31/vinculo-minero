name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, lint, tipos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tipos
        run: mypy app/core
      - name: Tests
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (tipos, formato, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Cuando esté commiteado package-lock.json, cambiar por `npm ci` y activar cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
